name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows でも動かす前提のため、両方の OS でテストする。ローカル（macOS）の緑は
    # 他プラットフォームの緑ではない（pandas の並びやロケール依存の入出力で実際に差が出た）。
    # fail-fast を切って、片方が落ちてももう片方の結果を得られるようにする
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
