name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows でも動かす前提のため、両方の OS でテストする。ローカル（macOS）の緑は
    # 他プラットフォームの緑ではない（pandas の並びやロケール依存の入出力で実際に差が出た）。
    # fail-fast を切って、片方が落ちてももう片方の結果を得られるようにする
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest

  package:
    # 配布物の検査。既定設定・テンプレート・プロンプトは .py ではないため、wheel から
    # 抜けてもテストは緑のまま通り、インストールして初めて動かないことが分かる。
    # OS に依らない内容なので ubuntu だけで見る
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv build --out-dir dist
      - name: wheel に資材が同梱されているか
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"wheel が1つに決まりません: {wheels}")
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          required = [
              "seat_analyzer/default-config.yaml",
              "seat_analyzer/templates/workspace-config.yaml",
              "seat_analyzer/templates/dashboard.css",
              "seat_analyzer/templates/dashboard.html.j2",
              "seat_analyzer/prompts/discussion.md",
              "seat_analyzer/prompts/aspects-full.md",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit("wheel に同梱されていません:\n  " + "\n  ".join(missing))
          print(f"{wheels[0]}: 資材 {len(required)} 件を確認")
          PY
