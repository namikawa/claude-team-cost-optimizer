# seat-analyzer のワークスペース設定（上書きファイル）
#
# ここには既定から変えたい項目の差分だけを書く。書かなかった項目はプログラムに同梱された
# 既定設定が使われるので、このファイルは全行コメントのままでも動く。
#
# モデル単価・シート料金・入力 CSV のカラム対応表は、プログラムの更新で全利用者へ配られる。
# 通常ここには書かない（写すと更新が届かなくなる）。ここに書くのは、この環境やこの組織に
# 固有で、他の利用者と共有しない設定に限る。
#
# 書き方の規則:
#   - 辞書はキー単位で既定にマージされる（下の例では hysteresis_months だけが変わる）
#   - リストと単一の値は丸ごと置き換わる（一覧を部分的に足すことはできない）
#   - 既定に無いキーを書くとエラーになる（綴り違いで設定が黙って無効になるのを防ぐため）

# 入出力ディレクトリ。CSV とレポートをワークスペースの外に置く場合に書く
#   相対パスはこのファイルの置き場所が基準（どのディレクトリから実行しても同じ場所を指す）
#   絶対パスと `~`（ホームディレクトリ）も書ける
#   --input-dir / --output-dir を付けた実行では、そのフラグが優先される
# paths:
#   input: ../seat-analysis-data/input
#   output: ../seat-analysis-data/reports

# 考察の執筆まわり（同じセクションは1箇所にまとめて書く）
#   allow_terms: 混入チェックで恒久的に許可する語。他組織の部署名などが一般語と衝突して
#                誤検出になるときに使う。第一手は名前を識別力のあるものに直すこと
#                （3文字以下の略称は衝突しやすい）
#   command:     考察の執筆に使う CLI。PATH に置けない場合だけフルパスを書く
# discussion:
#   allow_terms: ["<誤検出になった語>"]
#   command: /usr/local/bin/claude

# 判定のヒステリシス。既定より慎重にしたい（連続 N ヶ月の一致を求める）場合に上げる
# decision:
#   hysteresis_months: 3

# claude.ai からの CSV 取得（collect --source claude）。使う場合だけ書く
#   profiles_dir / staging_dir: 専用プロファイルとダウンロードの一時置き場。既定から
#     変えるときだけ書く（相対パスはこのファイルの置き場所が基準。`~` も書ける）
#   chrome_path: Chrome が既定の場所に無いときだけ、実行ファイルの絶対パスを書く
#   login_warning_days: --check-login で「期限間近」にする残り日数（既定 3。確認の間隔 +
#     対応の猶予で決める。週次で確かめるなら 8 など）
#   organizations.<組織名>.claude_export: 取得する組織。複数スペースの組織は
#     organizations.<組織名>.workspaces.<workspace名>.claude_export に書く。org_id は
#     collect --source claude --list-orgs <profile> で調べる。organizations は他の設定
#     （github_org・workspaces）と同じ1箇所にまとめて書く
# claude_export:
#   profiles_dir: ~/.seat-analyzer/profiles
#   staging_dir: ~/.seat-analyzer/exports
#   chrome_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
#   login_warning_days: 8
# organizations:
#   <組織名>:
#     claude_export:
#       profile: corp
#       org_id: 00000000-0000-4000-8000-000000000001
#       kinds: [members, spend, code]

# この組織で使わせない product。既定は空で、組織のポリシーに応じてここに書く
# （リストは丸ごと置き換わるので、必要な product 名をすべて並べる。既定の primary /
# supplementary に載っている product 名もそのまま書ける）
# product_policy:
#   prohibited: ["<この組織で使わせない product 名>"]
