# Claude Team シート最適化分析 パッケージ内デフォルト設定
#
# 単価・閾値の既定はすべてここで管理する。ワークスペースの config.yaml に差分を書くと
# ここの値を上書きできる（辞書はキー単位で再帰マージ、リストと値は丸ごと置換）。
# モデル単価・カラムのエイリアス表はプログラムの更新で配られるので、ワークスペース側へ
# 写す必要はない。実データが溜まったら allowance_usd をキャリブレーションすること
# （docs/reference.md「allowanceのキャリブレーション」参照）。

# 入出力ディレクトリの既定（CLI の --input-dir / --output-dir を省略したときに使う）。
# ワークスペースの config.yaml にここを書くと、実行のたびにフラグを付けずに済む。
# 相対パスの基準はそれを書いた設定ファイルの置き場所（下の input / reports は
# パッケージ内の既定なので、例外としてカレントディレクトリ基準で解釈する）。
paths:
  input: input
  output: reports

seats:
  standard:
    price_usd: 25.0        # 月払い
    # Standard シートに「含まれる」利用量の API 換算 USD/月。
    # Anthropic 非公開のため推定値。low/mid/high の3シナリオで感度分析する。
    allowance_usd:
      low: 30.0
      mid: 50.0
      high: 75.0
  premium:
    price_usd: 125.0       # 月払い
    allowance_usd:
      low: 150.0
      mid: 250.0
      high: 375.0

decision:
  # 直近 N ヶ月連続で同じ推奨のときだけ「変更推奨」。それ未満は「要観察」。
  hysteresis_months: 2
  # 月あたり削減見込みが（Premium−Standard 差額 × この割合）以上のときのみ変更推奨。
  buffer_ratio: 0.20
  # Standard ユーザで api_cost >= allowance(mid) * この値 のとき
  # 「上限到達の可能性（需要が観測上限で切られている恐れ）」フラグを付ける。
  censoring_margin: 0.85

# V2 判定の設定（段階導入中）。enabled が false のあいだ、分析・レポートには影響しない。
decision_v2:
  enabled: false
  # Premium シートが正当化される全 product 需要の下限（USD/月・方針値）。
  # 降格: 評価窓の全完全月でこれ未満なら候補。
  # 昇格（追加クレジット無効）: 対象月がこれ以上なら上限つき付与（計測）の候補、
  #   2 完全月連続または月内の消費が継続上昇なら昇格の候補。
  # 昇格（追加クレジット不明）: これ以上なら設定確認（REVIEW）の対象。席は動かさない。
  # 追加クレジット有効の組織では使わない（実課金が観測できるため）。
  premium_justification_usd: 450.0
  # 判定に必要な完全月数。昇格（Standard→Premium）と降格（Premium→Standard）で
  # 非対称にする。昇格の遅れは戻しやすい機会損失、誤った降格は業務を止めるため、
  # 降格側を重くする。
  upgrade:
    min_complete_months: 1
    # 昇格候補の需要が Code 主体と言えるための最小の Code 需要（USD/月）。シート差額
    # ($100) 程度の需要は軽度の利用でも生じうるため、Code 主体の証明には差額の2倍を
    # 要求する。これを下回る候補は自動で昇格させず、アサインの見直しとして人へ回す。
    min_code_demand_usd: 200.0
  downgrade:
    min_complete_months: 2
    # 降格候補の Code 需要が「低い」と言える上限（USD/月）。これ以上の Code 需要が
    # 続く Premium ユーザは自動降格の対象にしない。
    max_code_demand_usd: 200.0
  # 「直近のシート変更」とみなす日数。シート変更 event の区間がこの窓（分析月末から
  # 遡る）に重なるユーザは自動判定せず観察に倒す。
  recent_seat_change_days: 28
  # Standard の実課金がシート差額（Premium − Standard = $100）をこの額以上上回ったとき、
  # 昇格候補にする（USD/月）。Premium 側の課金は観測できないので差額との比較に閉じる。
  observed_billing_margin_usd: 20.0

# GitHub 分析を有効にする組織（組織ごとの opt-in）。キーは入力ディレクトリ直下の組織名、
# 値はその組織の GitHub Organization 名で、両者は一致しない前提の対応表として書く。
# ここに書いた組織だけが doctor の GitHub 検査と GitHub 由来の集計の対象になり、
# 書かない組織は GitHub 関連の処理と警告から一切除外される。
# organizations の直下だけは既定に無いキー（組織名）を書ける。その中身は従来どおり
# 厳格で、書けるのは github_org だけ。
#   organizations:
#     example:
#       github_org: example-org
organizations: {}

# モデル単価（USD per 1M tokens）。model 名の部分一致（小文字）で判定、上から順に評価
# するため、特例（sonnet-5, opus-4-1 等）は汎用パターンより上に置くこと。
# cache_read は任意で、キャッシュ読取の倍率（入力単価に対する）をモデル別に指定する。
# 省略したパターンは cache_multipliers.read を使う。
# 公式: https://platform.claude.com/docs/en/about-claude/pricing（2026-09-02 照合）
model_prices:
  patterns:
    # Fable 5.1 / Mythos 5.1 のキャッシュ読取だけ 0.025 倍（他モデルは 0.1 倍）
    - { match: "fable-5-1",  input: 10.0, output: 50.0, cache_read: 0.025 }
    - { match: "fable",      input: 10.0, output: 50.0 }
    - { match: "mythos-5-1", input: 10.0, output: 50.0, cache_read: 0.025 }
    - { match: "mythos",     input: 10.0, output: 50.0 }
    - { match: "opus-4-1",   input: 15.0, output: 75.0 }   # 旧世代 Opus のみ高単価
    - { match: "opus",       input: 5.0,  output: 25.0 }   # 4.5〜4.8（実課金行との検算で一致確認済み）
    # Sonnet 5 の $2/$10 は導入価格（2026-08-31 まで）として発表されたが、
    # そのまま正式価格になり値上げは行われない（2026-09-02 公式確認）
    - { match: "sonnet-5",   input: 2.0,  output: 10.0 }
    - { match: "sonnet",     input: 3.0,  output: 15.0 }   # 4.5/4.6
    - { match: "haiku",      input: 1.0,  output: 5.0 }
  default: { input: 5.0, output: 25.0 }

# ユーザ需要（api_cost）の算出基準:
#   computed  = tokens×単価のAPI等価計算（キャッシュ実効単価込み）
#   net_spend = スペンドレポートの net_spend 列
#   auto      = net_spend 合計が computed の 50% 未満なら computed を採用
# 実データ検証（2026-07-05）: net_spend はシート込み利用が $0 になる「実課金額」であり
# 需要指標には使えないため computed を採用する。net_spend は「実課金（従量課金分）」
# として別列でレポートに表示する。
cost_basis: computed

# spend 列と tokens×単価 の乖離がこの割合を超えたら警告（cost_basis=net_spend 時のみ）
spend_validation:
  deviation_warn_ratio: 0.10

# 前月比較・月次推移（正式分析の「前月からの変化」セクション）の表示閾値。
# セクションを出すだけの表示用で、シート判定・ヒステリシスには影響しない。
trend:
  idle_usd: 1.0            # この需要未満は「利用なし」とみなす
  min_activity_usd: 10.0   # 利用開始/停止と判定する需要水準
  change_min_usd: 50.0     # 「主な増減」に載せる最小変化額
  top_changes: 5           # 主な増減の表示数

# スナップショット差分（同一月の複数エクスポートによる月中推移・停止検出）の閾値。
# 月初開始（1日〜）の累積エクスポートが同一月に2つ以上あるとき自動発動する。
snapshot_diff:
  stall_max_delta_usd: 1.0   # 最新区間の需要増分がこれ未満なら「停止疑い」
  min_cumulative_usd: 10.0   # 停止疑いの前提となる累積需要（遊休との区別）
  min_interval_days: 3       # 最新区間がこの日数未満なら停止判定しない

# product（Claude Code・Chat 等の利用面）の分類。費用比較は全 product の需要で行い、
# 活用の評価は primary（開発利用の主軸）に絞って見るための設定。
#   primary       活用評価の主軸。ここが空だと「開発利用」を定義できないためエラー
#   supplementary 補助的な利用面。需要が supplementary_high_usd 以上なら
#                 supplementary_high とみなす [USD/月]
#   prohibited    導入組織のポリシーで使わせない product。既定は空
#                 （特定組織のセキュリティ方針を配布物に含めない）
# primary と supplementary は互いに排他で、同じ product 名を両方に書くとどちらとして
# 数えるかが決まらないためエラーにする。prohibited はこの分類と直交する指定なので、
# primary・supplementary に載っている product を重ねて書いてよい。
# 同一の分類の中での重複は書き間違いとしてエラーにする
# （どちらの判定でも、前後空白・大小文字・Unicode の正規化形式の違いは同じ名前とみなす）。
product_policy:
  primary:
    - "Claude Code"
  supplementary:
    - "Chat"
    - "Cowork"
    - "Design"
    - "Research"
    - "Code Review"
    - "Claude in Slack"
  prohibited: []
  supplementary_high_usd: 100.0

# 入力 CSV のカラム名マッピング（実ファイルのヘッダに合わせて追記可能）。
# ヘッダは 小文字化・前後空白除去・連続空白/アンダースコア→単一スペース に
# 正規化してから照合する。
columns:
  spend:
    email:            ["email", "user email", "user"]
    account_uuid:     ["account uuid", "account id"]
    user_id:          ["user id"]
    product:          ["product", "product type", "surface"]
    model:            ["model", "model name"]
    requests:         ["request count", "requests", "num requests", "total requests"]
    prompt_tokens:    ["prompt tokens", "input tokens", "total prompt tokens"]
    completion_tokens: ["completion tokens", "output tokens", "total completion tokens"]
    gross_spend:      ["total gross spend usd", "gross spend usd", "gross spend"]
    net_spend:        ["total net spend usd", "net spend usd", "net spend"]
    web_search_count: ["total web search count", "web search count", "web searches"]
    # キャッシュ内訳（実スペンドレポートに存在。あると spend 検算の精度が上がる）
    uncached_input_tokens: ["total uncached input tokens", "uncached input tokens"]
    cache_read_tokens:     ["total cache read tokens", "cache read tokens"]
    cache_write_5m_tokens: ["total cache write 5m tokens", "cache write 5m tokens"]
    cache_write_1h_tokens: ["total cache write 1h tokens", "cache write 1h tokens"]
  members:
    email:         ["email", "user email"]
    account_uuid:  ["account uuid", "account id"]
    user_id:       ["user id"]
    seat_type:     ["seat", "seat type", "seat tier", "plan", "subscription"]
    member_status: ["status", "member status"]
  code_analytics:
    email:       ["email", "user", "user email", "member"]
    prs_with_cc: ["prs with cc", "prs with claude code", "cc prs"]
    prs_total:   ["all prs", "total prs", "prs"]
    loc_with_cc: ["lines with cc", "lines of code with cc", "lines with claude code", "cc lines", "lines this month"]
    loc_total:   ["all lines", "total lines", "lines"]
  # 任意ファイル members-info.csv（部署・チーム・職種・備考のマッピング。手動メンテ）
  # 組織階層は 部署 > チーム。department と team は別軸でどちらか一方だけでもよい
  members_info:
    email:      ["email", "user email", "メールアドレス"]
    department: ["department", "dept", "部署", "所属"]
    team:       ["team", "チーム", "グループ"]
    role:       ["role", "職種", "役割"]
    note:       ["note", "memo", "備考", "コメント"]
    # 追加クレジット（usage credits）のユーザ上限 κ [USD/月]。管理画面で設定される値を手入力。
    # 正数=有効（上限あり）/ 0=無効 / 無制限=有効（上限なし）/ 空欄=不明
    credit_limit_usd: ["credit limit", "credit limit usd", "extra usage limit",
                       "spending limit", "追加クレジット上限", "従量上限"]
  # 管理画面の手入力CSV input/<組織名>/admin/（organization-YYYY-MM-DD.csv /
  # users-YYYY-MM-DD.csv）。CSVエクスポートの無い管理画面の表を人手で写すための正準形式。
  # organization は1ファイル1行（ある時点の組織の契約）、users は1メール1行。
  admin_organization:
    snapshot_date:           ["snapshot date", "取得日"]
    standard_purchased:      ["standard purchased", "standard seats", "standard席数"]
    premium_purchased:       ["premium purchased", "premium seats", "premium席数"]
    billing_frequency:       ["billing frequency", "billing", "支払頻度"]
    renewal_date:            ["renewal date", "更新日"]
    standard_unit_price_usd: ["standard unit price usd", "standard unit price", "standard単価"]
    premium_unit_price_usd:  ["premium unit price usd", "premium unit price", "premium単価"]
    org_credit_enabled:      ["org credit enabled", "organization credit enabled", "組織クレジット"]
    org_credit_limit_usd:    ["org credit limit usd", "org credit limit", "組織クレジット上限"]
    source:                  ["source", "取得元"]
  admin_users:
    snapshot_date:    ["snapshot date", "取得日"]
    email:            ["email", "user email", "メールアドレス"]
    account_uuid:     ["account uuid", "account id"]
    credit_enabled:   ["credit enabled", "extra usage enabled", "追加クレジット有効"]
    credit_limit_usd: ["credit limit", "credit limit usd", "extra usage limit",
                       "追加クレジット上限"]
    credit_mtd_usd:   ["credit mtd usd", "credit mtd", "credit used mtd", "当月消費"]
    source:           ["source", "取得元"]
  # 任意ファイル github-members.csv（email → GitHub login の対応表。手動メンテ）
  github_members:
    email:        ["email", "user email", "メールアドレス"]
    github_login: ["github login", "github username", "github user", "github id",
                   "githubログイン", "githubユーザー名", "githubアカウント"]

# 追加クレジット（usage credits）関連の閾値。
usage_credits:
  # 上限到達とみなす残額。V1 の損益分岐判定・ヒステリシスには影響せず、上限到達の表示に
  # 使う。V2 昇格判定では、上限へ到達したかどうかの判断にこの値を使う。
  cap_tolerance_usd: 5.0
  grant_suggested_cap_usd: 150  # 付与候補に提示する推奨初期上限（表示のみ）

# キャッシュトークンの実効単価係数（入力単価に対する倍率）。
# 実データで net_spend = uncached×1.0 + cache_read×0.1 + write_5m×1.25 + write_1h×2.0
# + completion×出力単価 と一致することを確認済み（2026-07-05）。
# read は全モデル共通の既定で、model_prices.patterns 側に cache_read があればそれを優先する。
cache_multipliers:
  read: 0.1
  write_5m: 1.25
  write_1h: 2.0

# 考察セクションの自動執筆（seat-analyzer discuss / analyze --with-discussion）。
# ローカルの Claude Code CLI をヘッドレスで呼び、考察本文だけを生成させる。
# LLM にツールは渡さず（資料はプロンプトへ埋め込む）、書き込みと混入チェックはツール側が行う。
discussion:
  command: claude          # ヘッドレス実行する CLI。PATH 上の名前かフルパス
  model: opus              # 別名指定で最新の Opus に追従する
  effort: xhigh            # 判定の妥当性検証と執筆に高い推論品質が必要（low/medium/high/xhigh/max）
  timeout_seconds: 1800    # 1組織あたりの応答待ち上限
  max_attempts: 2          # 混入検出時の書き直しを含む試行回数
  min_output_chars: 200    # これ未満の出力は失敗扱い（API エラー等をレポートへ書かないため）
  retries: 2               # 一時エラー（429・5xx・タイムアウト）の再試行回数。混入の書き直しとは別軸
  retry_wait_seconds: 30   # 再試行までの待機秒数
  # 1組織あたりの LLM 呼び出しは最悪 max_attempts × (retries + 1) 回になる（既定で6回）
  # 混入チェックで恒久的に許可する語。他組織の部署名等が一般語と衝突して誤検出になる場合に
  # 使う（例: 短い略称）。--allow-term は単一組織実行に限られるため、全組織実行でも効く
  # 許可はここに書く。組織名・メールアドレスは対象外（許可できない）。
  # 第一手は名前を識別力のあるものに直すこと（3文字以下の略称は衝突しやすい）
  allow_terms: []
